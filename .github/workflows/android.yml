name: AquaApp CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    # Данные подписи берутся из секретов репозитория
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
    # 1. Получаем код
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Устанавливаем JDK (Java Development Kit)
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 25

    # 3. Кэшируем зависимости Gradle (ускоряет сборку в разы)
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Make gradlew executable
      run: chmod +x gradlew

    # 4. Расшифровываем Keystore ДО сборки, иначе релиз не подпишется
    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore.jks

    # 5. Запускаем unit-тесты
    - name: Run unit tests
      run: ./gradlew testDebugUnitTest --no-daemon

    # 6. Собираем релизную версию (APK для Firebase)
    - name: Assemble Release APK
      run: ./gradlew assembleRelease --no-daemon

    # 7. Собираем AAB (формат для Google Play)
    - name: Bundle Release AAB
      run: ./gradlew bundleRelease --no-daemon

    # 8. Загружаем артефакты для скачивания из вкладки Actions
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: app/build/outputs/apk/release/app-release.apk

    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: app-release-aab
        path: app/build/outputs/bundle/release/app-release.aab

    # 9. Fastlane: отправляем сборку тестировщикам (только при пуше в main)
    - name: Set up Ruby
      if: github.event_name == 'push'
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'

    - name: Install Fastlane
      if: github.event_name == 'push'
      run: bundle install

    - name: Run Fastlane Distribute
      if: github.event_name == 'push'
      env:
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      run: bundle exec fastlane distribute
